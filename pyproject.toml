[build-system]
requires = [
  "setuptools==75.8.2",
  "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "dental-market-analysis"
version = "0.1.0"
description = "Dental clinic location analysis and reproducible data pipelines for South Korea"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "yhryu0409" },
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
]

[project.scripts]
dental-market = "dental_market.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dental_market = ["fixtures/*.jsonl"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
